[package]
name = "swrite-core"
version = "0.1.0-rc1"
description = "Swrite 2 Native Document & Filesystem Core Engine"
authors = ["Swrite Authors"]
license = "MIT"
edition = "2021"

[lib]
name = "swrite_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.5", features = [] }

[dependencies]
tauri = { version = "2.2.4", features = [] }
tauri-plugin-shell = "2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
pulldown-cmark = "0.12"
notify = "7.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
tempfile = "3.16"
parking_lot = "0.12"
regex = "1.11"
base64 = "0.22"
printpdf = "0.7"


[dev-dependencies]
tempfile = "3.16"
